# Cloudflare Workers — free tier only (workers.dev). No custom domains / paid plans.
name = "kaspa-mcp"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
KASPA_MCP_VERSION = "0.2.0"
KASPA_MCP_GIT_SHA = "0a7cc4c"
KASPA_MCP_BUILD_TIME = "2026-10-31T02:43:43Z"
# No secrets required for read-only + unsigned-tx mode.
MCP_PUBLIC = "true"
# Prepare-only mainnet L1 (unsigned SafeJSON). Never accept mainnet keys.
KASPA_L1_MAINNET_WRITES = "1"
# Force L1 prepare → browser_build (kaspa-wasm static assets).
KASPA_L1_BROWSER_BUILD = "1"
# Shared demo: enable per-IP limits. Self-hosters: omit or set false (off by default in code).
RATE_LIMIT_ENABLED = "true"
RATE_LIMIT_REQUESTS = "60"
RATE_LIMIT_REQUESTS_PERIOD_SEC = "60"
RATE_LIMIT_COMPILE = "5"
RATE_LIMIT_COMPILE_PERIOD_SEC = "600"
RATE_LIMIT_IP_CEILING = "180"
RATE_LIMIT_IP_CEILING_PERIOD_SEC = "60"

# Free Workers Rate Limiting bindings (no extra charge; periods must be 10 or 60).
# General: 60 req / 60s per IP (per Cloudflare location, approximate).
[[ratelimits]]
name = "REQUEST_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 60
period = 60

# Compile floor: 1 / 60s per IP. Longer "5 per 10 min" is enforced via Cache API + isolate.
[[ratelimits]]
name = "COMPILE_RATE_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 1
period = 60

# solc-js (~11 MB) is NOT bundled. compile_solidity loads soljson from
# https://binaries.soliditylang.org at runtime on Workers (see src/backends/compile.ts).

# Short-lived prepare→approve sessions (free KV). TTL set per-key (~15 min).
[[kv_namespaces]]
binding = "SIGN_SESSIONS"
id = "dc99577f3ba4452499cf5150e54797a6"
preview_id = "b62028ef832f476d9abb756013a32516"

# Static assets (kaspa-wasm web build). Not counted toward Worker script size.
# Per-file limit 25 MiB; kaspa_bg.wasm ~11 MiB.
[assets]
directory = "./public"
binding = "ASSETS"
# Worker handles API/MCP/sign pages; wasm JS served as assets.
run_worker_first = ["/mcp", "/mcp/*", "/api/*", "/health", "/sign", "/sign/*", "/page", "/page/*", "!/sign/app.js", "!/sign/app.css", "/t", "/t/*", "!/sign/l1-build.js"]
